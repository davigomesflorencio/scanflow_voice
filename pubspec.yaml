name: gnix_tts
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.1+2

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^2.0.0
  http: ^1.6.0
  just_audio: ^0.10.6
  flutter_dotenv: ^6.0.1
  delightful_toast: ^1.1.0
  get: ^4.7.3
  google_mlkit_text_recognition: ^0.17.1
  google_mlkit_commons: ^0.13.0
  camera: ^0.12.1
  image_picker: ^1.2.4
  camera_android: ^0.10.12
  flutter_expandable_fab: ^2.5.2
  siri_wave: ^2.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  icons_launcher: ^3.1.0

flutter:

  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
      - .env
      - assets/fonts/rubik.ttf
      - assets/ai-microphone.png
      - assets/speech.png
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

icons_launcher:
  image_path: 'assets/ai-microphone.png'
  platforms:
    android:
      enable: true
    ios:
      enable: true